<!DOCTYPE html>
<html>
<head>
  <title>Cadastro</title>
  <style>
    body {
        font-family: Arial;
        background-color: #f4f4f4;
    }

    #principal {
        text-align: center;
        color: purple;
    }

    form {
        width: 300px;
        margin: auto;
        padding: 20px;
        background-color: white;
        border-radius: 10px;
    }

    label {
        display: block;
        margin-top: 10px;
    }

    input {
        width: 90%;
        padding: 8px;
    }

    .destaque {
        margin-top: 15px;
        width: 90%;
        padding: 8px;
        background-color: blue;
        color: white;
        border: none;
        font-weight: bold;
    }
  </style>
</head>
<body>
  <h1 id="principal">Cadastro de Usuário</h1>
  <form>
    <label>Nome:</label>
    <input type="text">
    <label>E-mail:</label>
    <input type="email">
    <label>Senha:</label>
    <input type="password">
    <button type="submit" class="destaque">Cadastrar</button>
  </form>
</body>
</html>
