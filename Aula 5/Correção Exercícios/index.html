<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 5</title>
    <style>
        p {
            color: blue;
        }
        .destaque {
            color: red;
            font-weight: bold;
        }

        #principal {
            color: green;
            font-size: 32px;
        }

        body {
            background-color: yellow;
        }

        p {
            font-family: Arial;
            font-size: 24px;
            font-style: italic;
        }

        h1 {
            text-align: center;
        }

        form {
            width: 300px;
        }

        button {
            background-color: green;
            color: white;
            border: none;
        }
    </style>
</head>
<body>
    <h1 id="principal">Meu Título</h1>
    <p>Primeiro parágrafo.</p>
    <p>Segundo parágrafo.</p>
    <p class="destaque">Texto 1</p>
    <h2 class="destaque">Texto 2</h2>
    <span class="destaque">Texto 3</span>
    <p style="color: #FF0000;">Parágrafo vermelho (hexadecimal)</p>
    <p style="color: rgb(0, 255, 0);">Parágrafo verde (RGB)</p>
    <p style="color: blue;">Parágrafo azul (nome da cor)</p>
    <form>
        <label>Nome:</label>
        <input type="text">
        <label>E-mail:</label>
        <input type="email">
        <label>Telefone:</label>
        <input type="tel">
        <button>Botão</button>
    </form>
</body>
</html>
